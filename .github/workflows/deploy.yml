name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NPM_VERSION: 11.16.0

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: https://krivoshei.dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Verify and build site
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Validate deployment configuration
        shell: bash
        run: |
          for variable in AWS_REGION AWS_ROLE_ARN AWS_S3_BUCKET AWS_CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing GitHub production environment variable: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Publish site to S3
        shell: bash
        run: |
          aws s3 sync dist/ "s3://${AWS_S3_BUCKET}/" \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

          aws s3 sync dist/_astro/ "s3://${AWS_S3_BUCKET}/_astro/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Refresh CloudFront
        shell: bash
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Verify production endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://krivoshei.dev/ > /dev/null
