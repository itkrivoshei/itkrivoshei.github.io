AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub Actions OIDC access for the portfolio deployment

Parameters:
  GitHubRepository:
    Type: String
    Default: itkrivoshei/itkrivoshei.github.io
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  SiteBucketName:
    Type: String
  CloudFrontDistributionId:
    Type: String

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: krivoshei.dev
        - Key: ManagedBy
          Value: CloudFormation

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: krivoshei-portfolio-github-deploy
      Description: Deploy krivoshei.dev from the production GitHub environment
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: portfolio-deployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListSiteBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}
              - Sid: DeploySiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}/*
              - Sid: InvalidateSiteDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}
      Tags:
        - Key: Project
          Value: krivoshei.dev
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  DeployRoleArn:
    Description: Configure this as AWS_ROLE_ARN in the GitHub production environment
    Value: !GetAtt GitHubDeployRole.Arn
  GitHubOidcProviderArn:
    Value: !Ref GitHubOidcProvider
